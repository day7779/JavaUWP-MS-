name: Nightly build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nightly.yml"
      - "MC.Xbox/**"
      - "glfw_shim/**"
      - "compat_mod/**"
      - "controller_mod/**"
      - "mouse_support/**"
      - "patch/**"
      - "scripts/**"
      - "log_configs/**"
      - "mesa-runtime/**"
      - "build.ps1"
      - "xbox_security.properties"
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish nightly
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Export JDK 17 path
        shell: powershell
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "JDK 17: $env:JAVA_HOME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Export JDK 21 path
        shell: powershell
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "JDK 21: $env:JAVA_HOME"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Clean generated outputs
        shell: powershell
        run: .\scripts\clean.ps1 -Apply

      - name: Restore Fabric remap cache
        uses: actions/cache@v4
        with:
          path: staging/cache/gameDir/.fabric/remappedJars
          key: fabric-remap-${{ runner.os }}-${{ hashFiles('scripts/config.ps1') }}

      - name: Restore loader installer cache
        uses: actions/cache@v4
        with:
          path: staging/cache/loader-installers
          key: loader-installers-${{ runner.os }}-${{ hashFiles('config/versions.tsv') }}
          restore-keys: |
            loader-installers-${{ runner.os }}-

      - name: Restore download manifest cache
        uses: actions/cache@v4
        with:
          path: staging/cache/manifests
          key: manifests-${{ runner.os }}-${{ hashFiles('config/versions.tsv', 'scripts/new-download-manifest.ps1', 'scripts/common.ps1') }}
          restore-keys: |
            manifests-${{ runner.os }}-

      - name: Restore patched loader clients
        uses: actions/cache@v4
        with:
          path: prebuilt
          key: prebuilt-${{ runner.os }}-${{ hashFiles('config/versions.tsv', 'scripts/prepare-forge-patched-client.ps1', 'scripts/gen-neoforge-artifacts.ps1') }}
          restore-keys: |
            prebuilt-${{ runner.os }}-

      - name: Prepare build cache
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Resolve nightly package version
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$manifest = Get-Content MC.Xbox\Package.appxmanifest
          $parts = ([string]$manifest.Package.Identity.Version) -split '\.'
          if ($parts.Count -ne 4) {
            throw "Package.appxmanifest Identity Version must have four numeric fields."
          }

          $base = "$($parts[0]).$($parts[1]).$($parts[2])"
          $revision = 1
          $repo = $env:GITHUB_REPOSITORY
          $apiBase = if ($env:GITHUB_API_URL) { $env:GITHUB_API_URL } else { "https://api.github.com" }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          try {
            $release = Invoke-RestMethod -Method Get -Uri "$apiBase/repos/$repo/releases/tags/nightly" -Headers $headers
            if ($release.body -match 'Package version:\s+(\d+)\.(\d+)\.(\d+)\.(\d+)') {
              $previousBase = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
              if ($previousBase -eq $base) {
                $revision = [int]$Matches[4] + 1
              }
            }
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($revision -gt 65535) {
            throw "Nightly APPX revision exceeded 65535 for base $base."
          }

          $version = "$base.$revision"
          "APPX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APPX_FILE=BanditLauncher_$version.appx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Nightly APPX version: $version"

      - name: Build APPX
        shell: powershell
        run: .\build.ps1 -SkipStopAppProcesses -AppxVersion $env:APPX_VERSION

      - name: Stage nightly asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "output\$env:APPX_FILE" dist\BanditLauncher-nightly.appx -Force
          $hash = Get-FileHash dist\BanditLauncher-nightly.appx -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  BanditLauncher-nightly.appx" | Set-Content -Path dist\BanditLauncher-nightly.sha256 -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanditLauncher-nightly
          path: |
            dist/BanditLauncher-nightly.appx
            dist/BanditLauncher-nightly.sha256
          if-no-files-found: error

      - name: Move nightly tag
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly $env:GITHUB_SHA
          git push --force origin refs/tags/nightly

      - name: Publish nightly release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\publish-release.ps1 `
            -Channel nightly `
            -Sha $env:GITHUB_SHA `
            -AppxVersion $env:APPX_VERSION `
            -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            -Asset dist\BanditLauncher-nightly.appx, dist\BanditLauncher-nightly.sha256
