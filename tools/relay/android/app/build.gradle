plugins {
    id "com.android.application"
}

def sdlVersion = "3.4.10"
def sdlAarName = "SDL3-${sdlVersion}.aar"
def sdlAar = layout.projectDirectory.file("libs/${sdlAarName}")
def sdlAndroidZipName = "SDL3-devel-${sdlVersion}-android.zip"
def sdlAndroidZip = layout.buildDirectory.file("downloads/${sdlAndroidZipName}")

tasks.register("downloadSdlAar") {
    outputs.file(sdlAar)
    doLast {
        def target = sdlAar.asFile
        def archive = sdlAndroidZip.get().asFile
        target.parentFile.mkdirs()
        if (!target.exists()) {
            archive.parentFile.mkdirs()
            def url = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/${sdlAndroidZipName}"
            logger.lifecycle("Downloading ${url}")
            new URI(url).toURL().withInputStream { input ->
                archive.withOutputStream { output ->
                    output << input
                }
            }
            copy {
                from zipTree(archive)
                include sdlAarName
                into target.parentFile
            }
            if (!target.exists()) {
                throw new GradleException("${sdlAarName} was not found in ${sdlAndroidZipName}")
            }
        }
    }
}

android {
    namespace "dev.bandit.mouserelay"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "dev.bandit.mouserelay"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.2.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }
}

preBuild.dependsOn("downloadSdlAar")

dependencies {
    implementation files("libs/${sdlAarName}")
}
